<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T.R.E. | Painel do Patrão</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 0; color: #333; }
        .header { background-color: #0d1b2a; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .container { padding: 20px; max-width: 600px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .filter-buttons { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
        .btn-filter { padding: 8px 14px; border: none; border-radius: 20px; background: #e0e0e0; cursor: pointer; font-weight: bold; }
        .btn-filter.active { background: #1b263b; color: white; }
        input, button.btn-submit { width: 100%; padding: 12px; margin-top: 10px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        button.btn-submit { background: #ff7700; color: white; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <div style="font-weight: bold;">T.R.E. | Painel do Patrão</div>
        <button style="background: #ff4d4d; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer;" onclick="sair()">Sair</button>
    </div>

    <div class="container">
        <!-- Cadastrar Nova Obra -->
        <div class="card">
            <h3>Cadastrar Nova Obra</h3>
            <input type="text" id="nomeObra" placeholder="Nome da Obra (ex: Avanço RJ)">
            <input type="text" id="enderecoObra" placeholder="Localização / Endereço">
            <button class="btn-submit" onclick="cadastrarObra()">Cadastrar Obra</button>
        </div>

        <!-- Histórico e Gestão de Obras -->
        <div class="card">
            <h3>Histórico e Gestão de Obras</h3>
            <p style="font-size: 13px; color: #666;">Acompanhe o que está em andamento, pronto ou finalizado</p>
            
            <!-- Abas reordenadas: Em Andamento primeiro, Prontas, Finalizadas e Todas por último -->
            <div class="filter-buttons">
                <button class="btn-filter active" onclick="filtrarObras('Em Andamento', this)">Em Andamento</button>
                <button class="btn-filter" onclick="filtrarObras('Prontas', this)">Prontas</button>
                <button class="btn-filter" onclick="filtrarObras('Finalizadas', this)">Finalizadas</button>
                <button class="btn-filter" onclick="filtrarObras('Todas', this)">Todas</button>
            </div>

            <div id="listaObras">
                <div style="border-left: 4px solid #ffaa00; padding: 10px; background: #fffcf5; margin-bottom: 10px; border-radius: 4px;">
                    <strong>IFC</strong> <span style="font-size: 11px; background: #ffeeba; padding: 2px 6px; border-radius: 4px;">Em Andamento</span>
                    <p style="font-size: 12px; color: #555; margin: 5px 0 0 0;">Av. Nações Unidas, 14401 | Atualizado por: Patrão</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function filtrarObras(status, el) {
            document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            console.log('Filtrando por:', status);
        }

        function cadastrarObra() {
            const nome = document.getElementById('nomeObra').value;
            const endereco = document.getElementById('enderecoObra').value;
            if(!nome) {
                alert('Digite o nome da obra!');
                return;
            }
            alert('Obra cadastrada com sucesso! Notificação enviada aos funcionários.');
            // Aqui entraria a integração de push notification via Supabase/OneSignal
        }

        function sair() {
            alert('Sessão encerrada.');
        }
    </script>
</body>
</html>
